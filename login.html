<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Hearth</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles/design-system.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/onboarding.css">

    <style>
        /* Reusing onboarding styles for simplicity, adding specific login overrides */
        .login-container {
            max-width: 400px;
            margin: 4rem auto;
            padding: 2rem;
            text-align: center;
        }

        .login-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            color: var(--color-text-muted);
            margin-bottom: 2rem;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h1 class="login-title">Welcome Back</h1>
        <p class="login-subtitle">Enter the Hearth</p>

        <form class="onboarding-form" id="login-form">
            <div class="form-group text-left" style="text-align: left;">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="input" placeholder="you@example.com" required>
            </div>

            <div class="form-group text-left" style="text-align: left;">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="input" placeholder="Your password" required>
            </div>

            <div class="step-actions">
                <button type="submit" class="btn btn-primary btn-large" style="width: 100%;">Log In</button>
            </div>

            <p class="mt-md">
                <a href="index.html" class="text-muted" style="text-decoration: underline;">Back to Home</a>
            </p>
        </form>
    </div>

    <script src="js/login.js"></script>
</body>

</html>
