
[build]
  command = "echo 'No build step required for static site'"
  publish = "."
  functions = "netlify/functions"

[dev]
  framework = "#static"
  
[[redirects]]
  from = "/api/conversations"
  to = "/.netlify/functions/parlor"
  status = 200

[[redirects]]
  from = "/api/conversations/*"
  to = "/.netlify/functions/parlor"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
