[build]
  command = "echo 'No build step required for static site'"
  publish = "."
  functions = "netlify/functions"

[dev]
  framework = "#static"

# Specific redirect for Pulse Feed
[[redirects]]
  from = "/api/pulse"
  to = "/.netlify/functions/pulse-feed"
  status = 200

# Specific redirect for Pulse sub-resources (like acknowledge)
[[redirects]]
  from = "/api/pulse/*"
  to = "/.netlify/functions/pulse-feed"
  status = 200

[[redirects]]
  from = "/api/kin/*"
  to = "/.netlify/functions/kin-management"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
