<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Hearth</title>
    <link rel="stylesheet" href="styles/design-system.css">
    <link rel="stylesheet" href="styles/components.css">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            background-color: var(--background);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: var(--shadow-outer);
            width: 100%;
            max-width: 400px;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: var(--text-secondary);
            text-decoration: none;
        }
    </style>
    <script src="js/theme-init.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Request Reset View -->
            <div id="request-reset-view">
                <h2 style="text-align: center; margin-bottom: 1.5rem;">Reset Password</h2>
                <p style="text-align: center; margin-bottom: 1.5rem; color: var(--text-secondary);">Enter your email to receive a password reset link.</p>
                <form id="request-reset-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="input" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Send Reset Link</button>
                </form>
                <a href="login.html" class="back-link">Back to Login</a>
            </div>

            <!-- Submit New Password View -->
            <div id="submit-password-view" style="display: none;">
                <h2 style="text-align: center; margin-bottom: 1.5rem;">New Password</h2>
                <p style="text-align: center; margin-bottom: 1.5rem; color: var(--text-secondary);">Enter your new password below.</p>
                <form id="submit-password-form">
                    <div class="form-group">
                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password" class="input" required minlength="8">
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" class="input" required minlength="8">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Reset Password</button>
                </form>
            </div>

             <!-- Success/Message View -->
             <div id="message-view" style="display: none; text-align: center;">
                <h2 id="message-title" style="margin-bottom: 1rem;"></h2>
                <p id="message-text" style="color: var(--text-secondary); margin-bottom: 1.5rem;"></p>
                <a href="login.html" class="btn btn-primary" style="display: inline-block; text-decoration: none;">Back to Login</a>
            </div>

        </div>
    </div>
    <script type="module" src="js/reset-password.js"></script>
</body>
</html>
