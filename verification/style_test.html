
        <!DOCTYPE html>
        <html>
        <head>
            <link rel="stylesheet" href="styles/design-system.css">
            <link rel="stylesheet" href="styles/components.css">
            <link rel="stylesheet" href="styles/app.css">
            <style>
                body { background-color: var(--background); padding: 50px; }
                .test-section { margin-bottom: 40px; }
            </style>
        </head>
        <body>
            <div class="test-section">
                <h2>Buttons</h2>
                <button class="btn">Default Button</button>
                <button class="btn btn-primary">Primary Button</button>
                <button class="btn active">Active Button</button>
            </div>

            <div class="test-section">
                <h2>Inputs</h2>
                <input type="text" class="input" placeholder="Type here...">
            </div>

            <div class="test-section">
                <h2>Cards</h2>
                <div class="card">
                    <h3>Card Title</h3>
                    <p>Card content goes here.</p>
                </div>
            </div>

            <div class="test-section">
                <h2>Pulse Actions</h2>
                <div class="pulse-actions">
                    <button class="pulse-action-btn">
                        <span>Like</span>
                    </button>
                    <button class="pulse-action-btn acknowledged">
                        <span>Liked</span>
                    </button>
                </div>
            </div>

            <div class="test-section">
                <h2>Nav Tabs</h2>
                <div class="nav-tabs" style="position: relative;">
                    <a href="#" class="nav-tab">Home</a>
                    <a href="#" class="nav-tab active">Profile</a>
                </div>
            </div>
        </body>
        </html>
